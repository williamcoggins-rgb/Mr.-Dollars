<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Dollars &mdash; Financial Intelligence</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Ambient floating particles (gold dust / dollar signs) -->
    <canvas id="ambient-canvas"></canvas>

    <div class="vault-app">

        <!-- Top Bar -->
        <header class="top-bar">
            <div class="brand">
                <h1>Mr. Dollars</h1>
                <span class="tagline">Financial Intelligence</span>
            </div>
            <div class="top-bar-right">
                <span id="report-period" class="period-label"></span>
                <div class="connection-badge">
                    <div id="connection-dot" class="status-dot disconnected"></div>
                    <span id="connection-label">Connecting</span>
                </div>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main class="dashboard">

            <!-- Scoreboard -->
            <section class="scoreboard-section" id="section-scoreboard">
                <div class="section-header">
                    <h2>Scoreboard</h2>
                    <div class="section-line"></div>
                </div>
                <div id="scoreboard-grid" class="scoreboard-grid">
                    <div class="glass-card metric-card"><div class="skeleton" style="width:55%;height:10px;margin-bottom:12px"></div><div class="skeleton" style="width:40%;height:26px"></div></div>
                    <div class="glass-card metric-card"><div class="skeleton" style="width:55%;height:10px;margin-bottom:12px"></div><div class="skeleton" style="width:40%;height:26px"></div></div>
                    <div class="glass-card metric-card"><div class="skeleton" style="width:55%;height:10px;margin-bottom:12px"></div><div class="skeleton" style="width:40%;height:26px"></div></div>
                    <div class="glass-card metric-card"><div class="skeleton" style="width:55%;height:10px;margin-bottom:12px"></div><div class="skeleton" style="width:40%;height:26px"></div></div>
                </div>
            </section>

            <!-- Decisions + Actions -->
            <div class="two-col">
                <section id="section-decisions">
                    <div class="section-header">
                        <h2>Decisions</h2>
                        <div class="section-line"></div>
                    </div>
                    <div id="decisions-list" class="decisions-list">
                        <div class="glass-card decision-row"><div class="skeleton" style="width:100%;height:44px"></div></div>
                    </div>
                </section>

                <section id="section-actions">
                    <div class="section-header">
                        <h2>Next Actions</h2>
                        <div class="section-line"></div>
                    </div>
                    <div id="actions-list" class="actions-list">
                        <div class="glass-card action-row"><div class="skeleton" style="width:100%;height:22px"></div></div>
                    </div>
                </section>
            </div>

            <!-- Tools Row -->
            <div class="tools-row">
                <div class="glass-card tool-panel">
                    <h3>Capital Evaluator</h3>
                    <div class="capital-input-row">
                        <input id="cashflows-input" class="capital-input" type="text"
                               placeholder="-5000, 1500, 1800, 2000, 2200">
                        <button id="btn-evaluate-capital" class="btn btn-gold">Evaluate</button>
                    </div>
                    <div id="capital-result"></div>
                </div>

                <div class="glass-card tool-panel">
                    <h3>Time Loom</h3>
                    <div id="loom-status" class="loom-status-card">
                        <div class="loom-badge">$</div>
                        <div class="loom-details">
                            <div class="loom-label">Connection</div>
                            <div class="loom-value">Checking...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="report-footer">
                <span id="report-timestamp"></span>
            </div>
        </main>
    </div>

    <!-- Roaming Mr. Dollars — fixed overlay, positioned by JS -->
    <canvas id="dollar-canvas" width="320" height="400"></canvas>

    <!-- Speech bubble — follows avatar, positioned by JS -->
    <div id="speech-bubble" class="speech-bubble">
        <div id="speech-text">Standing by for your report.</div>
        <div class="mood-indicator">
            <div id="mood-dot" class="mood-dot confident"></div>
            <span id="mood-label">Mood: confident</span>
        </div>
    </div>

    <!-- Bottom Control Strip -->
    <div class="control-strip">
        <button id="btn-generate" class="btn btn-green">Generate Report</button>
        <button id="btn-demo" class="btn btn-gold">Load Demo</button>
    </div>

    <!-- Scripts -->
    <script src="/static/js/dollar-avatar.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
