<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Dollars — Financial Intelligence Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <div>
                    <h1>MR. DOLLARS</h1>
                    <div class="subtitle">Financial Intelligence Assistant</div>
                </div>
            </div>
            <div class="header-status">
                <span id="report-period" style="font-size:0.8rem; color:#9ca3af;"></span>
                <div class="status-indicator">
                    <div id="connection-dot" class="status-dot disconnected"></div>
                    <span id="connection-label">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Left: Avatar Panel -->
        <aside class="avatar-panel">
            <div id="dollar-canvas"></div>

            <div id="avatar-speech" class="avatar-speech">
                Initializing Mr. Dollars...
            </div>

            <div id="avatar-mood" class="avatar-mood">Mood: initializing</div>

            <div class="avatar-controls">
                <button id="btn-generate" class="btn btn-primary">
                    Generate Report
                </button>
                <button id="btn-demo" class="btn btn-gold">
                    Load Demo Data
                </button>
            </div>

            <!-- Time Loom Status -->
            <div style="margin-top:24px; width:100%; max-width:360px;">
                <div class="section-title">Time Loom Connection</div>
                <div id="loom-status" class="loom-status">
                    <div class="loom-icon">$</div>
                    <div class="loom-info">
                        <div class="label">Time Loom</div>
                        <div class="value">Checking...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Right: Dashboard Panel -->
        <main class="dashboard-panel">
            <!-- Scoreboard -->
            <section class="dashboard-section">
                <h2 class="section-title">Scoreboard</h2>
                <div id="scoreboard-grid" class="scoreboard-grid">
                    <!-- Skeleton placeholders -->
                    <div class="metric-card">
                        <div class="skeleton" style="width:60%; height:12px; margin-bottom:8px;"></div>
                        <div class="skeleton" style="width:40%; height:24px;"></div>
                    </div>
                    <div class="metric-card">
                        <div class="skeleton" style="width:60%; height:12px; margin-bottom:8px;"></div>
                        <div class="skeleton" style="width:40%; height:24px;"></div>
                    </div>
                    <div class="metric-card">
                        <div class="skeleton" style="width:60%; height:12px; margin-bottom:8px;"></div>
                        <div class="skeleton" style="width:40%; height:24px;"></div>
                    </div>
                    <div class="metric-card">
                        <div class="skeleton" style="width:60%; height:12px; margin-bottom:8px;"></div>
                        <div class="skeleton" style="width:40%; height:24px;"></div>
                    </div>
                </div>
            </section>

            <!-- Decisions -->
            <section class="dashboard-section">
                <h2 class="section-title">Decisions</h2>
                <div id="decisions-list" class="decisions-list">
                    <div class="decision-card">
                        <div class="skeleton" style="width:100%; height:48px;"></div>
                    </div>
                </div>
            </section>

            <!-- Next Actions -->
            <section class="dashboard-section">
                <h2 class="section-title">Next Actions</h2>
                <div id="actions-list" class="actions-list">
                    <div class="action-item">
                        <div class="skeleton" style="width:100%; height:20px;"></div>
                    </div>
                </div>
            </section>

            <!-- Capital Project Evaluator -->
            <section class="dashboard-section">
                <h2 class="section-title">Capital Project Evaluator</h2>
                <div class="capital-form">
                    <div class="form-row">
                        <span class="form-label">Cash flows</span>
                        <input id="cashflows-input"
                               class="form-input"
                               type="text"
                               placeholder="-5000, 1500, 1800, 2000, 2200"
                               title="Comma-separated cash flows. First value is typically negative (investment).">
                    </div>
                    <div class="form-row">
                        <span class="form-label"></span>
                        <button id="btn-evaluate-capital" class="btn" style="flex:1;">
                            Evaluate NPV / IRR
                        </button>
                    </div>
                    <div id="capital-result"></div>
                </div>
            </section>

            <!-- Report Metadata -->
            <section class="dashboard-section" style="opacity:0.5;">
                <span id="report-timestamp" style="font-size:0.72rem; color:#6b7280;"></span>
            </section>
        </main>
    </div>

    <!-- Three.js (r160 via CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <!-- Mr. Dollars scripts -->
    <script src="/static/js/dollar-avatar.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
